name: Auto-merge feature branches

on:
  push:
    branches:
      - 'claude/**'
      - 'cursor/**'

jobs:
  automerge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into main
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout main
          if ! git merge --no-ff origin/${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into main"; then
            echo "::error::Merge conflict with main. Rebase locally and re-push — refusing to auto-resolve."
            git merge --abort || true
            exit 1
          fi
          git push origin main

      - name: Delete merged branch
        run: git push origin --delete "${{ github.ref_name }}"
