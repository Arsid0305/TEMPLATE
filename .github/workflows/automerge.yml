name: Auto-merge feature branches

on:
  push:
    branches:
      - 'claude/**'
      - 'cursor/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: _main
          sparse-checkout: scripts/check_consistency.py
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: _feature
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run consistency check
        run: python _main/scripts/check_consistency.py --root _feature

  automerge-to-main:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into main
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout main
          if ! git merge --no-ff "origin/$BRANCH_NAME" -m "Auto-merge $BRANCH_NAME into main"; then
            echo "::error::Merge conflict with main. Rebase locally and re-push — refusing to auto-resolve."
            git merge --abort || true
            exit 1
          fi
          git push origin main

      - name: Delete merged branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH_NAME"
