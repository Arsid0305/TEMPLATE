name: Auto-merge feature branches

on:
  push:
    branches:
      - 'claude/**'
      - 'cursor/**'

jobs:
  automerge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync docs from code and filesystem
        run: |
          python scripts/gen_docs.py
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/ARCHITECTURE.md README.md SYSTEM.md
          git diff --staged --quiet || git commit -m "auto: sync docs [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Run tests
        run: cd runtime && pytest tests/ -v

      - name: Merge into main
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout main
          if ! git merge --no-ff origin/${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into main"; then
            echo "::error::Merge conflict with main. Rebase locally and re-push — refusing to auto-resolve."
            git merge --abort || true
            exit 1
          fi
          git push origin main

      - name: Delete merged branch
        run: git push origin --delete "${{ github.ref_name }}"
